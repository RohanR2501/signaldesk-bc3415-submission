[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "signaldesk"
version = "0.1.0"
description = "Retail review intelligence with local sentiment inference and traceable complaint evidence"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.162,<0.163",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.14,<3",
  "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
data = ["polars>=1.35,<2", "matplotlib>=3.10,<3.11", "numpy>=2.3,<2.4"]
baselines = ["scikit-learn==1.9.1", "joblib>=1.5,<2", "threadpoolctl>=3.6,<4"]
gpu = [
  "torch==2.13.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "transformers>=5,<6",
  "accelerate>=1.10,<2",
]

[project.scripts]
signaldesk-data = "signaldesk_data.prepare:main"
signaldesk-baselines = "signaldesk_ml.baselines:main"

[dependency-groups]
dev = [
  "httpx2>=2.14,<3",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/signaldesk", "ml/signaldesk_data", "ml/signaldesk_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src", "ml", "scripts"]
extend-exclude = [".tools", ".runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/src", "ml/signaldesk_data", "ml/signaldesk_ml", "scripts", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "threadpoolctl"]
ignore_missing_imports = true

[tool.uv]
required-version = "==0.13.5"

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

